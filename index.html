<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rene Cell – Gestão</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d232b;--mu:#6b7480;--bd:#dde1e6;--pr:#d62828;--ok:#2e9e4f;--er:#8f1d1d;--nav:#2b323b;--hl:#fdecec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181c;--card:#1f242a;--tx:#eceff2;--mu:#9aa3ae;--bd:#333b44;--nav:#0f1114;--hl:#3a1818;--pr:#e03a3a;--er:#b32626;color-scheme:dark}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--nav);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:18px;color:var(--pr)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#cfd5dc;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--pr);color:#fff}
main{max-width:1050px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mu);font-weight:600}
.big{font-size:24px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;font:inherit;min-width:0}
button.b{background:var(--pr);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button.g{background:var(--ok)}button.r{background:var(--er)}button.s{padding:4px 10px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mu);text-transform:uppercase}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
.ok{background:var(--ok)}.er{background:var(--er)}.wa{background:#e0a100}
.rhead img{display:block;width:100%;max-width:270px;margin:0 auto 6px}.rht{font:12px/1.4 Arial,sans-serif;text-align:center;color:#000}.rq{display:block;width:150px;height:150px;margin:6px auto;image-rendering:pixelated}
.rcpt{font:13px/1.35 'Courier New',monospace;white-space:pre-wrap;color:#000;background:#fff;padding:12px;margin:0}
#rcp{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow:auto;z-index:50}
.rbox{background:#fff;color:#000;border-radius:8px;padding:12px;width:min(100%,420px);margin:auto}
@media print{html,body{height:auto!important;margin:0!important;padding:0!important;background:#fff!important}:root{padding:0!important}header,main{display:none!important}#rcp{position:static!important;background:none!important;padding:0!important;display:block!important;overflow:visible!important}.noprint{display:none!important}.rbox{width:var(--w)!important;margin:0 auto!important;padding:0!important;border-radius:0!important}.rcpt{font-size:var(--fs)!important;font-weight:bold;line-height:1.25!important;padding:0!important}.rhead div{font-size:var(--fs)!important}.rhead img{max-width:100%!important}.rq{width:var(--qr)!important;height:var(--qr)!important}.rhead,.rcpt,.rq{break-inside:avoid}}
.mu{color:var(--mu)}.pv{background:var(--hl);border:2px solid var(--pr)}
#login{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:99;padding:16px}#login form{background:#1b1b1b;border-radius:12px;padding:24px;width:min(100%,340px);display:flex;flex-direction:column;gap:10px;color:#fff}#login input{width:100%}#lm{color:#ff6b6b;min-height:18px;font-size:14px}
</style>
</head>

const TABS=[['ini','Início'],['pdv','Venda (PDV)'],['vd','Vendas'],['sv','Serviços'],['prod','Produtos'],['cli','Clientes/Garantia'],['ped','Pedidos'],['cup','Cupons'],['tr','Trocas'],['vend','Vendedores']];
let db=null,tab='ini',P=[],C=[],V=[],O=[],K=[],cart=[],sel='',pend=null,W=[],L=[],T=[],SV=[],OS=[],svt='list',svq='',svf='Todas',scart=[],osp='',PS=null,SO={cpf:'',nome:'',tel:'',ap:'',imei:'',def:'',tec:'',desc:'',pags:[],forma:''},vdd='',ev=null,ed='',ct='info',bx=false,bq='',bc='',tr=null,trq='';
let S={cpf:'',nome:'',forma:'',band:'Visa',parc:1,cupom:'',desc:'',vend:'',vale:'',pags:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const cents=s=>Math.round(parseFloat(String(s).replace(/\./g,'').replace(',','.')||0)*100)||0;
const dg=s=>String(s||'').replace(/\D/g,'');
const cpfF=s=>{s=dg(s);return s.length==11?s.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):s};
const iso=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)};
const ago=d=>Math.floor((Date.now()-new Date(d))/864e5);
const left=f=>Math.ceil((new Date(f+'T23:59:59')-Date.now())/864e5);
const br=d=>(d.length>10?new Date(d).toLocaleDateString('sv-SE'):d.slice(0,10)).split('-').reverse().join('/');
const cli=cpf=>C.find(c=>c.cpf==dg(cpf));
const findP=c=>{c=String(c).trim();return P.find(p=>p.barras==c||p.cod==c)};
const typing=()=>['INPUT','SELECT'].includes(document.activeElement?.tagName);

function draw(){
  $('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
  $('#app').innerHTML=db?({ini,pdv,prod,cli:cliT,ped,cup,tr:troca,vend:vendT,vd:vendasT,sv:svT})[tab]():'<div class="card">Carregando… (se demorar, confira o arquivo config.js)</div>';
  if(tab=='pdv')(pend?$('#okp'):bx?$('#bqi'):$('#scan'))?.focus();
  if(tab=='prod')$('#nb')?.focus();
  if(tab=='cli'&&db){cl();cd()}
  if(ev&&tab=='vd')evSum();
}
function go(t){tab=t;pend=null;draw()}

/* ---------- INÍCIO ---------- */
function garList(){const o=[];V.forEach(v=>(v.itens||[]).forEach(i=>{if(i.garFim)o.push({cpf:v.cpf,nome:v.nome||'—',desc:i.desc,imei:i.imei||'',data:v.data,fim:i.garFim,dias:left(i.garFim)})}));return o.sort((a,b)=>a.fim.localeCompare(b.fim))}
function ini(){
  const h=hoje(),vh=V.filter(v=>new Date(v.data).toLocaleDateString('sv-SE')==h),baixo=P.filter(p=>p.qtd<=(p.min||0));
  return `<div class="grid">
  <div class="card"><h3>Vendas hoje</h3><div class="big">${R(vh.reduce((s,v)=>s+v.total,0))}</div><span class="mu">${vh.length} venda(s)</span></div>
  <div class="card"><h3>Estoque baixo</h3><div class="big">${baixo.length}</div></div>
  <div class="card"><h3>Pedidos abertos</h3><div class="big">${O.filter(o=>o.status=='Aberto').length}</div></div>
  <div class="card"><h3>Serviços pendentes</h3><div class="big">${OS.filter(o=>['Pendente','Em andamento'].includes(o.status)).length}</div></div>
  <div class="card"><h3>Garantias vencendo (15 dias)</h3><div class="big">${garList().filter(g=>g.dias>=0&&g.dias<=15).length}</div></div></div>
  <h3>Estoque baixo / zerado</h3><div class="tw"><table><tr><th>Produto</th><th>Qtd</th><th>Mín</th></tr>${baixo.map(p=>`<tr><td>${esc(p.desc)}</td><td>${p.qtd}</td><td>${p.min||0}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">Tudo certo.</td></tr>'}</table></div>`;
}

/* ---------- PRODUTOS (scanner) ---------- */
function prod(){return edForm()+`<div class="card"><h3>Novo produto — leia o código de barras no primeiro campo</h3><div class="row">
  <input id="nb" placeholder="📷 Código de barras" size="16" onkeydown="if(event.key=='Enter'){event.preventDefault();scanNew()}">
  <input id="nd" placeholder="Nome do produto" size="28"><input id="nc" placeholder="Categoria (ex.: Película Privacidade)" size="24">
  <input id="nk" placeholder="Custo R$" size="8"><input id="nv" placeholder="Venda R$" size="8">
  <input id="nm" placeholder="Estoque mín." size="8" type="number"><input id="ng" placeholder="Garantia (dias)" size="9" type="number">
  <button class="b" onclick="addProd()">Salvar</button></div><div id="nmsg" class="mu"></div></div>

  if(k.tipo=='pct')return Math.round(un.reduce((s,x)=>s+x,0)*k.pct/100);
  if(k.tipo=='combo')return un.length>=k.n?Math.round(un.reduce((s,x)=>s+x,0)*k.pct/100):0;
  if(k.tipo=='leve'){const free=Math.floor(un.length/k.m)*(k.m-k.n);return un.slice(un.length-free).reduce((s,x)=>s+x,0)}
  return 0}

  <input id="ka" placeholder="Vale para (ex.: película privacidade) — vazio = tudo" size="34"><label class="mu">Válido até <input id="kv" type="date"></label><button class="b" onclick="addK()">Criar</button></div></div>
  <div class="tw"><table><tr><th>Cupom</th><th>Regra</th><th>Vale para</th><th>Validade</th><th>Status</th><th></th></tr>${K.map(k=>`<tr><td>${esc(k.nome)}</td><td>${k.tipo=='leve'?`Compre ${k.n} leve ${k.m}`:k.tipo=='pct'?`${k.pct}% de desconto`:`Compre ${k.n} e ganhe ${k.pct}%`}</td><td>${esc(k.alvo)||'Tudo'}</td><td>${k.val?br(k.val):'—'}</td>
  <td><button class="b s ${k.ativo?'g':'r'}" onclick="db.doc('cupons/${k.id}').update({ativo:${!k.ativo}})">${k.ativo?'Ativo':'Inativo'}</button></td><td><button class="b r s" onclick="db.doc('cupons/${k.id}').delete()">×</button></td></tr>`).join('')||'<tr><td colspan="6" class="mu">Nenhum cupom.</td></tr>'}</table></div>`}
async function addK(){const tipo=$('#kt').value,n=+$('#kN').value,m=+$('#kM').value,pct=+$('#kP').value,nome=$('#kn').value.trim();
  if(!nome)return alert('Dê um nome ao cupom.');
  if(tipo=='leve'&&!(n>0&&m>n))return alert('Informe Compre (N) e Leve (M), com M maior que N.');
  if(tipo=='pct'&&!(pct>0))return alert('Informe o %.');
  if(tipo=='combo'&&!(n>0&&pct>0))return alert('Informe N e o %.');
  await db.collection('cupons').add({nome,tipo,n,m,pct,alvo:$('#ka').value.trim(),val:$('#kv').value,ativo:true});
  ['kn','kN','kM','kP','ka'].forEach(i=>$('#'+i).value='')}

/* ---------- EXTRAS ---------- */
const idv=v=>v.id.slice(0,6).toUpperCase();
const valeAtual=()=>S.vale?L.find(v=>v.codigo==S.vale&&v.status=='ativo'&&(!v.cpf||v.cpf==dg(S.cpf))):null;
function edForm(){const p=ed&&P.find(x=>x.id==ed);if(!p)return '';
 const f=(i,l,v,t)=>`<label class="mu">${l}<br><input id="${i}" ${t||''} value="${esc(v)}" size="14"></label>`,m=c=>((c||0)/100).toFixed(2).replace('.',',');
 return `<div class="card pv"><h3>Editando: ${esc(p.desc)}</h3><div class="row">${f('ebz','Código de barras',p.barras)}${f('edd','Nome',p.desc)}${f('ecc','Categoria',p.cat||'')}${f('ek','Custo R$',m(p.custo))}${f('ev','Venda R$',m(p.venda))}${f('eq','Estoque',p.qtd,'type="number"')}${f('em','Estoque mín.',p.min||0,'type="number"')}${f('eg','Garantia (dias)',p.gar||0,'type="number"')}</div><button class="b g" onclick="saveEd()">Salvar</button> <button class="b r" onclick="ed='';draw()">Cancelar</button></div>`}
async function saveEd(){const b=$('#ebz').value.trim();
 if(!b||!$('#edd').value.trim())return alert('Código e nome são obrigatórios.');
 if(P.some(x=>x.id!=ed&&x.barras==b))return alert('Esse código já é de outro produto.');
 await db.doc('produtos/'+ed).update({barras:b,cod:b,desc:$('#edd').value.trim(),cat:$('#ecc').value.trim(),custo:cents($('#ek').value),venda:cents($('#ev').value),qtd:parseInt($('#eq').value)||0,min:+$('#em').value||0,gar:+$('#eg').value||0});ed='';draw()}
/* busca de produto no PDV */
function busca(){const cats=[...new Set(P.map(p=>p.cat).filter(Boolean))].sort();
 return `<div class="card pv"><h3>Pesquisar produto</h3><div class="row"><input id="bqi" size="30" placeholder="Nome, código ou barras" value="${esc(bq)}" oninput="bq=this.value;bl()"><select onchange="bc=this.value;bl()"><option value="">Todas as categorias</option>${cats.map(c=>`<option ${bc==c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="b r" onclick="bx=false;draw()">Fechar</button></div><div class="tw" id="br" style="max-height:320px;overflow:auto">${bt()}</div></div>`}
function bt(){const q=bq.toLowerCase(),l=P.filter(p=>(!bc||p.cat==bc)&&(p.barras+' '+p.desc).toLowerCase().includes(q)).slice(0,40);
 return `<table><tr><th></th><th>Código</th><th>Produto</th><th>Categoria</th><th>Venda</th><th>Estoque</th></tr>${l.map(p=>`<tr><td><button class="b s" onclick="pick('${p.id}')">✔</button></td><td>${esc(p.barras)}</td><td>${esc(p.desc)}</td><td>${esc(p.cat)}</td><td>${R(p.venda)}</td><td>${p.qtd}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">Nada encontrado.</td></tr>'}</table>`}
function bl(){$('#br').innerHTML=bt()}
function pick(id){const p=P.find(x=>x.id==id);if(p.qtd<1)return alert('Sem estoque.');pend=p;bx=false;draw()}
/* vendedores */
function vendT(){return `<div class="card"><h3>Novo vendedor</h3><div class="row"><input id="wc" placeholder="Código" size="8"><input id="wn" placeholder="Nome" size="24"><button class="b" onclick="addW()">Salvar</button></div></div><div class="tw"><table><tr><th>Código</th><th>Nome</th><th>Vendas</th><th>Total vendido</th><th></th></tr>${W.map(w=>{const vs=V.filter(v=>v.vendId==w.id);return `<tr><td>${esc(w.cod)}</td><td>${esc(w.nome)}</td><td>${vs.length}</td><td>${R(vs.reduce((s,v)=>s+v.total,0))}</td><td><button class="b r s" onclick="if(confirm('Excluir vendedor?'))db.doc('vendedores/${w.id}').delete()">×</button></td></tr>`}).join('')||'<tr><td colspan="5" class="mu">Nenhum vendedor.</td></tr>'}</table></div>`}
async function addW(){const cod=$('#wc').value.trim(),nome=$('#wn').value.trim();if(!cod||!nome)return alert('Informe código e nome.');if(W.some(w=>w.cod==cod))return alert('Código já usado.');await db.collection('vendedores').add({cod,nome})}
/* detalhe do cliente em abas */
function cd2(c){const vs=V.filter(v=>v.cpf==c.cpf),tb=[['info','Informações Gerais'],['vendas','Vendas'],['trocas','Trocas'],['cupons','Cupons'],['os','Serviços']];
 const row=(l,v)=>`<tr><th style="text-align:right;width:150px">${l}</th><td style="white-space:normal">${esc(v)||'—'}</td></tr>`,E=m=>`<tr><td colspan="9" class="mu">${m}</td></tr>`;let h;
 if(ct=='info')h=`<table>${row('Nome',c.nome)}${row('CPF/CNPJ',cpfF(c.cpf))}${row('WhatsApp',c.tel)}${row('E-mail',c.email)}${row('Endereço',c.end)}${row('Compras',vs.length+' ('+R(vs.reduce((s,v)=>s+v.total,0))+')')}</table>`;
 else if(ct=='vendas')h=`<table><tr><th>ID</th><th>Data</th><th>Há</th><th>Itens</th><th>Total</th><th>Pagamento</th><th>Garantia</th><th></th></tr>${vs.map(v=>`<tr><td><b>${idv(v)}</b></td><td>${br(v.data)}</td><td>${ago(v.data)} dias</td><td>${(v.itens||[]).map(i=>i.qtd+'x '+esc(i.desc)+(i.imei?' ('+esc(i.imei)+')':'')).join('<br>')}</td><td>${R(v.total)}</td><td>${esc(v.pag)}</td><td>${(v.itens||[]).map(i=>i.garFim?`<span class="tag ${left(i.garFim)<0?'er':'ok'}">${left(i.garFim)<0?'Vencida':'até '+br(i.garFim)}</span>`:'sem').join('<br>')}</td><td><button class="b s" onclick="trq='${v.id}';go('tr')">Trocar</button></td></tr>`).join('')||E('Sem compras.')}</table>`;
 else if(ct=='trocas')h=`<table><tr><th>Data</th><th>Compra</th><th>Produto</th><th>Tipo</th><th>Obs</th></tr>${T.filter(t=>t.cpf==c.cpf).map(t=>`<tr><td>${br(t.data)}</td><td>${esc(t.vid)}</td><td>${esc(t.desc)}</td><td>${t.tipo=='igual'?'Produto igual':'Vale '+esc(t.vale)+' ('+R(t.valor)+')'}</td><td>${esc(t.obs)}</td></tr>`).join('')||E('Nenhuma troca.')}</table>`;
 else if(ct=='os')h=`<table><tr><th>OS</th><th>Data</th><th>Há</th><th>Aparelho</th><th>Serviços</th><th>Total</th><th>Situação</th><th>Garantia</th></tr>${OS.filter(o=>o.cpf==c.cpf).map(o=>`<tr><td><b>${idv(o)}</b></td><td>${br(o.data)}</td><td>${ago(o.data)} dias</td><td>${esc(o.ap)}</td><td>${o.itens.map(i=>i.qtd+'x '+esc(i.desc)).join('<br>')}</td><td>${R(o.total)}${osFalta(o)?' <span class="tag wa">falta '+R(osFalta(o))+'</span>':''}</td><td>${o.status}</td><td>${o.itens.map(i=>i.garFim?`<span class="tag ${left(i.garFim)<0?'er':'ok'}">${left(i.garFim)<0?'Vencida':'até '+br(i.garFim)}</span>`:i.gar?i.gar+'d após concluir':'sem').join('<br>')}</td></tr>`).join('')||E('Nenhum serviço.')}</table>`;
 else h=`<table><tr><th>Código</th><th>Valor</th><th>Data</th><th>Status</th></tr>${L.filter(l=>l.cpf==c.cpf).map(l=>`<tr><td><b>${esc(l.codigo)}</b></td><td>${R(l.valor)}</td><td>${br(l.data)}</td><td><span class="tag ${l.status=='ativo'?'ok':'er'}">${l.status}</span></td></tr>`).join('')||E('Nenhum cupom.')}</table>`;
 $('#cd').innerHTML=`<div class="card" style="margin-top:12px"><h3>DETALHAR CLIENTE/GARANTIA — ${esc(c.nome)}</h3><div class="row">${tb.map(([k,n])=>`<button class="b s" style="${ct==k?'':'background:var(--mu)'}" onclick="ct='${k}';cd()">${n}</button>`).join('')}</div><div class="tw">${h}</div></div>`}
/* trocas e vales */
function tlH(){const q=trq.toLowerCase(),d=dg(trq);
 const vs=q?V.filter(v=>v.id.toLowerCase().startsWith(q)||(d&&v.cpf.includes(d))||(v.nome||'').toLowerCase().includes(q)).slice(0,15):[];
 return `<div class="tw"><table><tr><th>ID</th><th>Data</th><th>Cliente</th><th>Item</th><th>Valor</th><th></th></tr>${vs.flatMap(v=>(v.itens||[]).map((i,n)=>`<tr><td><b>${idv(v)}</b></td><td>${br(v.data)} (${ago(v.data)}d)</td><td>${esc(v.nome)||'—'}</td><td>${i.qtd}x ${esc(i.desc)}</td><td>${R(i.preco*i.qtd)}</td><td>${i.trocado?'<span class="mu">já trocado</span>':`<button class="b s" onclick="tr={v:'${v.id}',i:${n}};draw()">Trocar</button>`}</td></tr>`)).join('')||'<tr><td colspan="6" class="mu">Digite o ID da compra, CPF ou nome.</td></tr>'}</table></div>`}
function trF(){if(!tr)return '';const v=V.find(x=>x.id==tr.v),i=v&&v.itens[tr.i];if(!i)return '';
 return `<div class="card pv"><h3>Troca — compra ${idv(v)}</h3><b>${i.qtd}x ${esc(i.desc)}</b> — ${R(i.preco*i.qtd)}<div class="row" style="margin-top:8px"><select id="ttp" onchange="$('#tcw').style.display=this.value=='vale'?'':'none'"><option value="igual">Trocar por produto igual</option><option value="vale">Gerar cupom (vale) de ${R(i.preco*i.qtd)}</option></select><label><input type="checkbox" id="tvs"> Devolver o item ao estoque</label></div>
 <div class="row" id="tcw" style="display:none"><input id="tcp" size="26" placeholder="CPF (vazio = cupom genérico)" value="${cpfF(v.cpf)}"></div><div class="row"><input id="tob" size="40" placeholder="Motivo / observações"><button class="b g" onclick="doTroca()">Confirmar troca</button><button class="b r" onclick="tr=null;draw()">Cancelar</button></div></div>`}
function troca(){return `<div class="card"><h3>Buscar compra</h3><input id="tq" size="34" placeholder="ID da compra, CPF ou nome" value="${esc(trq)}" oninput="trq=this.value;$('#tl').innerHTML=tlH()"></div><div id="tl">${tlH()}</div>${trF()}
 <h3 style="margin-top:16px">Vales de troca</h3><div class="tw"><table><tr><th>Código</th><th>Valor</th><th>Cliente</th><th>Status</th></tr>${[...L].sort((a,b)=>b.data.localeCompare(a.data)).map(l=>`<tr><td><b>${esc(l.codigo)}</b></td><td>${R(l.valor)}</td><td>${l.cpf?esc(l.nome)+' '+cpfF(l.cpf):'Genérico (sem destinatário)'}</td><td><span class="tag ${l.status=='ativo'?'ok':'er'}">${l.status}</span></td></tr>`).join('')||'<tr><td colspan="4" class="mu">Nenhum vale.</td></tr>'}</table></div>`}
async function doTroca(){const v=V.find(x=>x.id==tr.v),i=v.itens[tr.i],p=P.find(x=>x.id==i.id),tp=$('#ttp').value,vs=$('#tvs').checked;
 let vale='',cpf=v.cpf,nome=v.nome||'';
 if(tp=='igual'){if(p&&p.qtd<(vs?0:i.qtd))return alert('Sem estoque para entregar o produto igual.');if(p)await db.doc('produtos/'+p.id).update({qtd:p.qtd-(vs?0:i.qtd)})}
 else{cpf=dg($('#tcp').value);if(cpf&&cpf.length!=11)return alert('CPF inválido.');nome=(cli(cpf)||{}).nome||'';
  vale=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  await db.collection('vales').add({codigo:vale,valor:i.preco*i.qtd,cpf,nome,status:'ativo',data:new Date().toISOString(),vid:idv(v)});
  if(vs&&p)await db.doc('produtos/'+p.id).update({qtd:p.qtd+i.qtd})}
 await db.doc('vendas/'+v.id).update({itens:v.itens.map((x,n)=>n==tr.i?{...x,trocado:true}:x)});
 await db.collection('trocas').add({data:new Date().toISOString(),vid:idv(v),vendaId:v.id,desc:i.desc,qtd:i.qtd,tipo:tp,valor:i.preco*i.qtd,vale,cpf,nome,obs:$('#tob').value.trim()});
 tr=null;alert(tp=='vale'?'Cupom gerado! Código: '+vale+(cpf?'':' (genérico)'):'Troca registrada.');draw()}

/* ---------- BANCO (Supabase) + LOGIN ---------- */
let SB=null,CFGERR='';
try{if(typeof supabase=='undefined')throw 'lib';if(typeof CFG=='undefined'||/COLE_AQUI/.test(CFG.url+CFG.key))throw 'cfg';SB=supabase.createClient(CFG.url,CFG.key)}
catch(e){CFGERR=e=='lib'?'Não consegui carregar a biblioteca do Supabase (internet ou bloqueio de anúncios/firewall).':'O arquivo config.js não foi preenchido ou não foi enviado junto com o index.html.'}
function mkdb(){
 const subs={};
 async function fetchAll(col){let all=[],from=0;for(;;){const {data,error}=await SB.from('docs').select('id,data').eq('col',col).range(from,from+999);if(error){console.error(error);break}all=all.concat(data);if(data.length<1000)break;from+=1000}return all}
 async function refresh(col){if(!subs[col])return;const rows=await fetchAll(col),sn={docs:rows.map(r=>({id:r.id,data:()=>r.data}))};subs[col].forEach(cb=>cb(sn))}
 const ref=(col,id)=>{const r={id,
  async get(){const {data}=await SB.from('docs').select('data').eq('col',col).eq('id',id).maybeSingle();return{exists:!!data,data:()=>data?data.data:undefined}},
  async set(d){const {error}=await SB.from('docs').upsert({col,id,data:d});if(error)throw error;refresh(col)},
  async update(p){const cur=(await r.get()).data()||{};const {error}=await SB.from('docs').upsert({col,id,data:{...cur,...p}});if(error)throw error;refresh(col)},
  async delete(){const {error}=await SB.from('docs').delete().eq('col',col).eq('id',id);if(error)throw error;refresh(col)}};return r};
 const api={
  collection(col){return{
   async add(d){const id=crypto.randomUUID(),{error}=await SB.from('docs').insert({col,id,data:d});if(error)throw error;refresh(col);return ref(col,id)},
   onSnapshot(cb){subs[col]=(subs[col]||[]).concat(cb);refresh(col)}}},
  doc(path){const i=path.indexOf('/');return ref(path.slice(0,i),path.slice(i+1))}};
 try{SB.channel('docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const c=(p.new&&p.new.col)||(p.old&&p.old.col);if(c)refresh(c);else Object.keys(subs).forEach(refresh)}).subscribe()}catch(e){}
 setInterval(()=>Object.keys(subs).forEach(refresh),30000);
 return api}
async function doLogin(){const m=$('#lm');m.textContent='';if(!SB){m.textContent=CFGERR;return}
 const {error}=await SB.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
 if(error){const t=error.message||'';m.textContent=/Invalid login/i.test(t)?'E-mail ou senha incorretos (confira se o usuário foi criado no Supabase).':/not confirmed/i.test(t)?'Usuário não confirmado: no Supabase, abra Authentication > Users e confirme o usuário.':/api key/i.test(t)?'Chave inválida no config.js. Copie a chave de Project Settings > API (veja o LEIA-ME).':'Erro: '+t;return}
 location.reload()}
const snap=(col,fn)=>db.collection(col).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));if(!typing())draw()});
(async()=>{
  let session=null;
  if(SB){try{session=(await SB.auth.getSession()).data.session}catch(e){CFGERR='Erro ao falar com o Supabase: '+e.message}}
  if(!session){$('#login').style.display='flex';if(CFGERR)$('#lm').textContent=CFGERR;return}
  db=mkdb();draw();
  snap('produtos',a=>P=a.sort((x,y)=>x.desc.localeCompare(y.desc)));
  snap('clientes',a=>C=a.sort((x,y)=>x.nome.localeCompare(y.nome)));
  snap('vendas',a=>V=a.sort((x,y)=>y.data.localeCompare(x.data)));
  snap('pedidos',a=>O=a.sort((x,y)=>y.data.localeCompare(x.data)));
  snap('cupons',a=>K=a);snap('servicos',a=>SV=a);snap('os',a=>OS=a.sort((x,y)=>y.data.localeCompare(x.data)));snap('vendedores',a=>W=a.sort((x,y)=>x.nome.localeCompare(y.nome)));snap('vales',a=>L=a);snap('trocas',a=>T=a.sort((x,y)=>y.data.localeCompare(x.data)));
})();
</script>
